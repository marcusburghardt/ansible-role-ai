---
# Role Defaults
ai_tasks:
  - { enabled: false, name: 'install_dependencies' }
  - { enabled: true, name: 'install_ollama' }
  - { enabled: true, name: 'configure_ollama' }
  - { enabled: true, name: 'install_opencode' }
  - { enabled: true, name: 'configure_opencode' }
  - { enabled: false, name: 'cleanup_opencode' }
  - { enabled: true, name: 'install_openspec' }
  - { enabled: true, name: 'install_speckit' }
  - { enabled: false, name: 'install_cursor' }
  - { enabled: false, name: 'configure_grafana_metrics' }

# User directories
ai_user_home_dir: "{{ ansible_facts['user_dir'] }}"
ai_user_scripts_dir: "{{ ai_user_home_dir }}/bin"

# AI Agent wrapper script
ai_agent_script_name: skynet

# AI Tools Versions
# For npm packages (OpenCode, OpenSPEC): set to "latest" for automatic updates
# on each run, or pin to a specific version (e.g., "1.2.3").
ai_opencode_version: latest
ai_openspec_version: latest
# For SpecKit: set to "latest" to auto-detect the newest GitHub release,
# or pin to a release tag (e.g., "v0.4.4").
# Available releases: https://github.com/github/spec-kit/releases
ai_speckit_version: latest

# Ollama settings
# Install method: "auto" detects from OS family (RedHat/Debian -> package,
# other -> script). Override with "package" or "script".
ai_ollama_install_method: auto

# SELinux: deploy a confined policy for the Ollama daemon.
# Required on SELinux-enforcing systems (e.g., Fedora) where the Ollama
# package does not ship its own policy. Without it, Ollama runs as init_t
# and is denied network access for model pulls and API binding.
# Disabled by default -- enable only on SELinux-enforcing hosts.
# See files/selinux/ollama.te for the full policy and permission rationale.
ai_ollama_selinux_policy: false

# Service lifecycle: "started" runs now, "stopped" installs only.
# "enabled" controls whether the service persists across reboots.
ai_ollama_service_enabled: false
ai_ollama_service_state: started

# Curated model list: override in playbook to manage models.
# Each entry supports three lifecycle states:
#   enabled: true                → model is pulled (ensure present)
#   enabled: false               → model is skipped (no-op, left as-is)
#   enabled: false, removed: true → model is deleted (ensure absent)
# The 'removed' field is optional and defaults to false. Setting both
# 'enabled' and 'removed' to true is invalid and will fail the playbook.
ai_ollama_models:
  - { enabled: true, name: 'qwen3:8b' }
  - { enabled: false, name: 'qwen3:32b' }
  - { enabled: false, name: 'devstral' }
  - { enabled: false, name: 'qwen3-coder:a3b' }
  - { enabled: false, name: 'llama3.1:8b' }

# AI Model settings
# Defaults to Ollama for a zero-cost out-of-box experience.
# Override to use paid providers (e.g., "google-vertex/claude-opus-4-6@default").
ai_model: "ollama/qwen3:8b"

# Per-agent model routing
# Each agent has its own model variable for independent override.
# All agents default to ai_model.
# For Ollama users (same model everywhere), this is a harmless no-op.
# For paid providers, override individual variables for cost-optimized routing.
# Reference: https://gist.github.com/jflowers/c54514358abf892df84d5e6b8e7d7772
ai_opencode_agent_build_model: "{{ ai_model }}"
ai_opencode_agent_plan_model: "{{ ai_model }}"
ai_opencode_agent_explore_model: "{{ ai_model }}"
ai_opencode_agent_general_model: "{{ ai_model }}"

# Full agent configuration dict, rendered directly into the "agents" block
# of opencode.json. Uses the per-agent model variables above. Override
# this dict only if agents gain non-model configuration knobs in the future.
ai_opencode_agents:
  build:
    model: "{{ ai_opencode_agent_build_model }}"
  plan:
    model: "{{ ai_opencode_agent_plan_model }}"
  explore:
    model: "{{ ai_opencode_agent_explore_model }}"
  general:
    model: "{{ ai_opencode_agent_general_model }}"

# GCP settings for AI model access
# Only relevant when google-vertex is in ai_opencode_providers.
# Harmlessly ignored otherwise.
ai_gcp_project: "your-gcp-project"
ai_vertex_location: "us-central1"

# Optional protected file containing only the EnMaaS API key on the target host.
# The launcher reads it at runtime; only its path is rendered by Ansible.
# A leading ~/ resolves to ai_user_home_dir. Empty preserves the environment.
ai_enmaas_key_file: ""

# OpenCode provider configuration
# Models from Ollama visible in OpenCode (independent of the pull list above).
# Maps Ollama model names to their display configuration.
ai_opencode_ollama_models:
  qwen3:8b:
    name: "Qwen 3 8B (local)"

# Full provider catalog for OpenCode. This dict is rendered directly into the
# "providers" block of opencode.json. Add, remove, or customize providers here.
# The Ollama entry uses a Jinja reference to ai_opencode_ollama_models, which
# Ansible resolves at template rendering time.
ai_opencode_providers:
  ollama:
    package: "aisdk:@ai-sdk/openai-compatible"
    name: "Ollama (local)"
    settings:
      baseURL: "http://localhost:11434/v1"
    models: "{{ ai_opencode_ollama_models }}"
  google-vertex:
    settings:
      project: "{{ ai_gcp_project }}"
      location: "{{ ai_vertex_location }}"
    models:
      claude-opus-4-6@default:
        settings:
          thinking:
            type: enabled
            budgetTokens: 32000

# OpenCode metrics plugin
# Pinned version of @mburghardt/opencode-metrics. Updated manually when
# the plugin releases a new version. Set to "local" to load the plugin
# from a local repository path (see ai_opencode_metrics_local_path).
ai_opencode_metrics_version: "0.3.0"

# Path to a local opencode-metrics repository on the target host.
# Only used when ai_opencode_metrics_version is "local". A leading tilde
# (~) is expanded to the target user's home directory by the role.
ai_opencode_metrics_local_path: ""

# Optional metrics plugin configuration. When non-empty, the role deploys
# config.yaml to ai_opencode_metrics_data_dir. When empty (default), the
# plugin creates its own defaults at first run.
ai_opencode_metrics_config: {}

# OpenCode plugins
# List of plugin packages for OpenCode V2. Empty by default while the metrics
# plugin awaits migration to the V2 plugin API. Local loader deployment and
# metrics configuration remain available for development.
# Override to add, remove, or replace plugins.
ai_opencode_plugins: []

# OpenCode configuration
ai_opencode_config_dir: "{{ ai_user_home_dir }}/.config/opencode"
ai_opencode_config_file: "{{ ai_opencode_config_dir }}/opencode.json"

# OpenCode V2 runs one shared background server per user. Restart it when the
# role changes the installation or configuration, so a new binary and new
# provider settings take effect without a manual restart.
# A service that is not running stays stopped; the role never starts it.
# Restarting preserves stored sessions but interrupts in-flight requests.
ai_opencode_restart_service: true

# OpenCode permission overrides
# Ordered list appended to _ai_opencode_permissions_default (last match wins).
# Each rule has action, resource, and effect (allow, ask, or deny) fields.
# Actions include shell, read, edit, and external_directory.
# Example: [{ action: shell, resource: "poetry *", effect: allow }]
ai_opencode_permissions: []

# OpenCode compaction settings
# Controls automatic context compaction behavior. Rendered directly into the
# "compaction" block of opencode.json. Override to tune retained context,
# the token buffer, or turn off auto-compaction.
ai_opencode_compaction:
  auto: true
  keep:
    tokens: 15000
  buffer: 10000

# OpenCode instruction files
# The ~/... path is resolved from the user's home directory (always loaded).
# Relative paths are resolved from the repo root (loaded if the file exists).
# Order matters: later entries override earlier ones on conflicting rules.
ai_opencode_instructions:
  - "~/.config/opencode/commit.md"
  - "~/.config/opencode/coding-standards.md"
  - ".specify/memory/constitution.md"
  - "AGENTS.md"

# Trusted GitHub organizations for command security guards
# Commands like checkout_pr and review_pr will verify the repo owner
# against this list before proceeding. Empty list means always ask.
ai_trusted_github_orgs: ['marcusburghardt', 'complytime', 'unbound-force']

# Environment shared by both ways of starting OpenCode: the launcher script
# exports it, and the role passes it when it restarts the shared service.
# Keeping one dict avoids divergence between the two launch paths.
ai_opencode_server_env:
  TRUSTED_GITHUB_ORGS: "{{ ai_trusted_github_orgs | join(',') }}"

# OpenCode commands
# Built-in commands from files/commands/ are auto-discovered and deployed.
# Disable specific built-ins by name (without .md extension):
ai_opencode_commands_disabled: []
#   - checkout_pr
#   - review_pr

# Deploy additional commands from local paths (relative to playbook or absolute):
ai_opencode_commands_custom: []
#   - src: ../shared-commands/deploy_staging.md
#   - src: /opt/team/audit.md
#     name: security_audit.md    # optional: override deployed filename

# OpenCode skills
# Built-in skills from files/skills/ are auto-discovered and deployed.
# Disable specific built-ins by name (directory name):
ai_opencode_skills_disabled: []
#   - some-built-in-skill

# Deploy additional skills from local paths (relative to playbook or absolute):
ai_opencode_skills_custom: []
#   - src: ../shared-skills/deploy-workflow
#   - src: /opt/team/review-skill
#     name: team-review          # optional: override deployed directory name

# Where to deploy user-level skills:
#   "agent-neutral"  => ~/.agents/skills/  (works with any AI agent)
#   "opencode"       => ~/.config/opencode/skills/  (OpenCode only)
ai_skills_target: agent-neutral

# Cursor IDE installation (disabled by default)
# Version: "latest" to track the newest release, or a major.minor version
# (e.g., "3.0") to pin. The full version is resolved from the Cursor API.
ai_cursor_version: latest
# Install method: "auto" detects from OS family (RedHat->rpm, Debian->deb,
# other->appimage). Override with "rpm", "deb", or "appimage".
ai_cursor_install_method: auto
# Directory for AppImage binary (only used when install method is appimage)
ai_cursor_appimage_dir: "{{ ai_user_home_dir }}/.local/bin"

# Grafana metrics visualization (disabled by default)
# Deploys a helper script and provisioning files for running an ephemeral
# Grafana container (podman) pre-configured with the opencode-metrics dashboard.
ai_grafana_metrics_port: 3033
ai_grafana_metrics_container_name: "opencode-grafana"
ai_grafana_metrics_script_name: "opencode-grafana"
ai_opencode_metrics_data_dir: "{{ ai_user_home_dir }}/.local/share/opencode-metrics"
ai_grafana_metrics_provisioning_dir: "{{ ai_opencode_config_dir }}/grafana"
# Monthly cost budget in USD. Drives color thresholds across all cost KPI
# panels (daily, weekly, monthly, yearly). Change this single value and
# re-run the playbook to update all thresholds automatically.
ai_grafana_metrics_monthly_budget: 300

# Cleanup (used by cleanup_opencode task, disabled by default in ai_tasks)
# Remove specific commands/skills from the target host by name.
ai_opencode_commands_cleanup: []
#   - old_command.md
ai_opencode_skills_cleanup: []
#   - deprecated-skill
