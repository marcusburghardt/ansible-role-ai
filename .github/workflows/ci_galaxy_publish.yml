# Publish role to Ansible Galaxy when a new release is published.
# Triggered by the release-please workflow after a release PR is merged.
# Requires GALAXY_API_KEY secret configured in the repository settings.
---
name: Publish to Ansible Galaxy

on:
  release:
    types:
      - published

permissions: {}

jobs:
  galaxy-import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install ansible-core==2.17.8

      - name: Import role to Galaxy
        run: >-
          ansible-galaxy role import
          --token "${{ secrets.GALAXY_API_KEY }}"
          "${{ github.repository_owner }}"
          "${{ github.event.repository.name }}"
