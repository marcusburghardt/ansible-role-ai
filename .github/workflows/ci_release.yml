# Create release PRs and tags from conventional commits.
# Release-please analyzes commits since the last tag, opens a PR with
# version bump and changelog updates. Merging the PR creates the tag
# and GitHub Release.
#
# When a release is created, this workflow also publishes the role to
# Ansible Galaxy in the same run. This avoids the GITHUB_TOKEN
# limitation where events from the default token do not trigger
# separate workflows (release.published would not fire).
---
name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  galaxy-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install ansible-core==2.17.8

      - name: Import role to Galaxy
        run: >-
          ansible-galaxy role import
          --token "${{ secrets.GALAXY_API_KEY }}"
          "${{ github.repository_owner }}"
          "${{ github.event.repository.name }}"
